<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del simulador</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --ink: #1d2126; --muted: #6a717b; --line: #dcd8d0;
  --accent: #2f6f9f; --ok: #2e8b57; --warn: #c7841a; --bad: #c0392b; --idle: #8a919a;
  --machine: #2b2f35; --machine-ink: #e9e6df; --key: #3c4148; --key-down: #6d8fb0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181c; --panel: #1e2227; --ink: #e6e3dc; --muted: #9aa1aa; --line: #333941;
    --accent: #6aa8d8; --machine: #0f1114; --machine-ink: #d8d4cc; --key: #2c3138; --key-down: #4f7aa2;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; padding: 14px 20px;
         border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; font-weight: 600; }
header .clock { font-family: var(--mono); color: var(--muted); }
main { display: grid; gap: 16px; padding: 16px 20px 28px;
       grid-template-columns: minmax(0, 560px) minmax(0, 1fr) minmax(0, 300px); }
@media (max-width: 1200px) { main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
     margin: 0 0 10px; font-weight: 600; }
.machine { background: var(--machine); border-radius: 10px; padding: 18px 14px 14px;
           display: grid; grid-template-columns: 64px 1fr 64px; gap: 12px; align-items: center; }
.keys { display: grid; gap: 14px; }
.key { width: 64px; height: 44px; border-radius: 7px; border: 1px solid #00000040; background: var(--key);
       color: var(--machine-ink); font: 600 11px/1 system-ui, sans-serif; cursor: pointer; user-select: none;
       touch-action: none; }
.key small { display: block; font-weight: 400; opacity: .7; margin-top: 3px; }
.key.down { background: var(--key-down); }
.screen { position: relative; aspect-ratio: 4 / 3; width: 100%; background: #050607; border-radius: 4px;
          overflow: hidden; }
.screen canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.screen .dark { position: absolute; inset: 0; background: #000c; color: #777; display: grid;
                place-items: center; font: 12px var(--mono); }
.bottom { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; gap: 12px; }
.led { width: 12px; height: 12px; border-radius: 50%; background: #3a1414; box-shadow: inset 0 0 2px #000; }
.led.on { background: #ff3b30; box-shadow: 0 0 10px #ff3b30; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); text-align: right; overflow-wrap: anywhere; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font: 600 12px var(--mono);
         color: #fff; background: var(--idle); }
.badge.ok { background: var(--ok); } .badge.warn { background: var(--warn); } .badge.bad { background: var(--bad); }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { font: 12px var(--mono); padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.dot.on { background: var(--warn); color: #fff; border-color: transparent; }
.controls { display: grid; gap: 8px; }
.controls label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.controls select, .controls input[type=range] { max-width: 150px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
button.act { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel);
             color: var(--ink); cursor: pointer; font: inherit; }
button.act:hover { border-color: var(--accent); }
a.act { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent);
        text-decoration: none; }
.charts { grid-column: 1 / -1; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.chart canvas { width: 100%; height: 150px; display: block; }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }
.log { font: 12px/1.5 var(--mono); max-height: 260px; overflow: auto; margin: 0; padding: 0; list-style: none; }
.log li { border-bottom: 1px dashed var(--line); padding: 2px 0; }
.log .t { color: var(--muted); margin-right: 8px; }
.note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Open Saeco · máquina virtual</h1>
  <span class="clock" id="clock">t = 0.000 s</span>
  <span class="clock" id="run"></span>
</header>
<main>
  <section>
    <h2>Frontal</h2>
    <div class="machine">
      <div class="keys" id="left"></div>
      <div class="screen"><canvas id="lcd" width="320" height="240"></canvas><div class="dark" id="dark">pantalla apagada</div></div>
      <div class="keys" id="right"></div>
      <div class="bottom"><span class="led" id="led" title="LED STBY"></span><span id="mid"></span></div>
    </div>
    <p class="note">Mantener pulsado = tecla pulsada. Mapa provisional: SW1 START, SW2 borrar fallo, SW4 standby, SW7 STOP.</p>
  </section>

  <section>
    <h2>Estado</h2>
    <div class="cards">
      <dl class="kv" id="stm"></dl>
      <dl class="kv" id="esp"></dl>
      <dl class="kv" id="brd"></dl>
      <dl class="kv" id="plant"></dl>
    </div>
    <h2 style="margin-top:14px">Cargas</h2>
    <div class="dots" id="loads"></div>
  </section>

  <section>
    <h2>Inyección y control</h2>
    <div class="controls">
      <label>Puerta cerrada <input type="checkbox" data-cmd="door" data-key="closed" id="c-door"></label>
      <label>Grupo presente <input type="checkbox" data-cmd="unit_present" id="c-unit"></label>
      <label>NTC abierto <input type="checkbox" data-cmd="ntc_open" id="c-ntc"></label>
      <label>Fallo del DRV8876 (nFAULT) <input type="checkbox" data-cmd="brew_fault" id="c-drv"></label>
      <label>STM32 colgado <input type="checkbox" data-cmd="stm_hang" id="c-stm"></label>
      <label>ESP32 colgado <input type="checkbox" data-cmd="esp_hang" id="c-esp"></label>
      <label>Teclado colgado <input type="checkbox" data-cmd="keypad_hang" id="c-kp"></label>
      <label>Ruido UART
        <select id="c-noise"><option value="0">0</option><option value="0.01">1 %</option><option value="0.05">5 %</option><option value="0.2">20 %</option></select></label>
      <label>Rails
        <select id="c-corner"><option value="nom">nominal</option><option value="min">mínimo</option><option value="max">máximo</option></select></label>
      <label>Sensor de agua <input type="range" min="0" max="3.3" step="0.1" id="c-water"></label>
      <label>Velocidad
        <select id="c-speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>5</option><option>10</option></select></label>
    </div>
    <div class="row">
      <button class="act" id="pause">Pausa</button>
      <button class="act" id="step">+100 ms</button>
      <button class="act" id="reboot">Reiniciar</button>
    </div>
    <div class="row">
      <a class="act" href="/api/vcd" download="open-saeco.vcd">Descargar VCD</a>
      <button class="act" id="clearvcd">Vaciar VCD</button>
    </div>
    <p class="note" id="vcdn"></p>
    <h2 style="margin-top:14px">Eventos</h2>
    <ul class="log" id="log"></ul>
  </section>

  <div class="charts">
    <section class="chart"><h2>Caldera</h2><canvas id="ch-boiler"></canvas><div class="legend" id="lg-boiler"></div></section>
    <section class="chart"><h2>Rails (STATUS)</h2><canvas id="ch-rails"></canvas><div class="legend" id="lg-rails"></div></section>
    <section class="chart"><h2>Grupo</h2><canvas id="ch-brew"></canvas><div class="legend" id="lg-brew"></div></section>
  </div>
</main>
<script>
const KEYS = {left: [['SW1','START'],['SW2','CLEAR'],['SW3','']], right: [['SW7','STOP'],['SW6',''],['SW5','']], mid: [['SW4','STBY']]};
const $ = id => document.getElementById(id);
async function cmd(c) {
  const r = await fetch('/api/cmd', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(c)});
  if (!r.ok) console.warn(await r.text());
  poll();
}
for (const [where, list] of Object.entries(KEYS)) for (const [sw, label] of list) {
  const b = document.createElement('button');
  b.className = 'key'; b.id = 'k-' + sw; b.innerHTML = `${sw}<small>${label || '·'}</small>`;
  const down = e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); cmd({cmd: 'press', sw, down: true}); };
  const up = () => cmd({cmd: 'press', sw, down: false});
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  $(where).appendChild(b);
}
document.querySelectorAll('input[type=checkbox][data-cmd]').forEach(el => el.addEventListener('change', () => {
  const c = {cmd: el.dataset.cmd}; c[el.dataset.key || 'value'] = el.checked; cmd(c);
}));
$('c-noise').onchange = e => cmd({cmd: 'uart_noise', value: +e.target.value});
$('c-corner').onchange = e => cmd({cmd: 'corner', value: e.target.value});
$('c-speed').onchange = e => cmd({cmd: 'speed', value: +e.target.value});
$('c-water').onchange = e => cmd({cmd: 'water_volts', value: +e.target.value});
let paused = false;
$('pause').onclick = () => cmd({cmd: 'pause', value: !paused});
$('step').onclick = () => cmd({cmd: 'step', ms: 100});
$('reboot').onclick = () => cmd({cmd: 'reboot'});
$('clearvcd').onclick = () => cmd({cmd: 'clear_vcd'});

const badge = (text, cls) => `<span class="badge ${cls || ''}">${text}</span>`;
const kv = (el, rows) => { el.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join(''); };
const yes = v => v ? badge('sí', 'ok') : badge('no', 'bad');
const STATE_CLS = {SAFE_IDLE: 'ok', BOOT: 'warn', FAULT: 'bad', RESET: 'bad'};
const SCREEN_CLS = {IDLE: 'ok', STARTING: 'warn', BOOT: 'warn', FAULT: 'bad', LINK_LOST: 'bad', STANDBY: ''};
const MSG = {0x01: 'HELLO', 0x20: 'STOP', 0x21: 'CLEAR_FAULT', 0x22: 'START', 0x23: 'UI_POWER'};
const ERR = {1: 'tipo desconocido', 2: 'longitud', 3: 'rechazado', 4: 'no implementado'};
let lastPixels = -1, setOnce = false;

function render(s) {
  $('clock').textContent = `t = ${s.t.toFixed(3)} s`;
  $('run').textContent = s.paused ? 'en pausa' : `×${s.speed}`;
  paused = s.paused; $('pause').textContent = s.paused ? 'Seguir' : 'Pausa';
  kv($('stm'), [['STM32', badge(s.stm.state, STATE_CLS[s.stm.state])], ['Enlace', yes(s.stm.link)],
    ['Órdenes', Object.entries(s.stm.outputs).filter(([, v]) => v).map(([k]) => k).join(', ') || 'ninguna'],
    ['STM_NRST', s.board.nrst ? 'alto' : badge('bajo', 'bad')]]);
  const lr = s.esp.last_reply;
  kv($('esp'), [['ESP32', s.esp.running ? badge(s.esp.screen, SCREEN_CLS[s.esp.screen]) : badge('arrancando', 'warn')],
    ['Enlace', yes(s.esp.link)], ['Frontal', `${s.esp.front}${s.esp.keypad_valid ? '' : ' · teclado inválido'}`],
    ['Peticiones / respuestas', `${s.esp.requests} / ${s.esp.replies}`],
    ['Última respuesta', lr ? `${lr.type === 0x7E ? 'ACK' : 'ERROR'} ${MSG[lr.for] || lr.for}${lr.code ? ' · ' + ERR[lr.code] : ''}` : '—']]);
  const st = s.status;
  kv($('brd'), [['3V3_UI', `${s.board.ui_volts.toFixed(2)} V`], ['Rails', s.board.corner],
    ['12 V / 24 V (STATUS)', st ? `${(st.rail_12v_mv / 1000).toFixed(2)} / ${(st.rail_24v_mv / 1000).toFixed(2)} V` : '—'],
    ['Grupo (STATUS)', st ? `${st.brew_ma} mA` : '—'], ['NTC (código)', st ? st.ntc_raw : '—'],
    ['Bytes UART perdidos', s.board.uart_dropped]]);
  kv($('plant'), [['Caldera', `${s.plant.boiler_c.toFixed(1)} °C`], ['Caudal', `${s.plant.flow_ml.toFixed(0)} ml`],
    ['Grupo', `posición ${s.plant.unit_pos.toFixed(2)} · ${s.plant.motor_a.toFixed(2)} A`],
    ['Agua (sensor)', `${s.plant.water_volts.toFixed(1)} V`]]);
  const L = s.board.loads;
  $('loads').innerHTML = [['relé', L.mains], ['calentador', L.heater], ['bomba', L.pump], ['molinillo', L.grinder],
    ['válvula', (L.valve_v || 0) > 12], ['grupo', Math.abs(L.motor_v || 0) > 6]]
    .map(([n, on]) => `<span class="dot ${on ? 'on' : ''}">${n}</span>`).join('');
  $('led').classList.toggle('on', s.board.led);
  $('dark').style.display = s.board.lcd_on ? 'none' : 'grid';
  for (const k of ['SW1','SW2','SW3','SW4','SW5','SW6','SW7']) $('k-' + k).classList.toggle('down', s.pressed.includes(k));
  if (!setOnce) {
    $('c-door').checked = s.plant.door_closed; $('c-unit').checked = s.plant.unit_present;
    $('c-water').value = s.plant.water_volts; setOnce = true;
  }
  $('c-ntc').checked = s.plant.ntc_open; $('c-drv').checked = s.faults.brew_fault;
  $('c-stm').checked = s.stm.hung; $('c-esp').checked = s.esp.hung; $('c-kp').checked = s.faults.keypad_hang;
  $('log').innerHTML = s.events.slice().reverse()
    .map(e => `<li><span class="t">${e.t.toFixed(3)}</span>${e.kind}${e.detail ? ' · ' + e.detail : ''}</li>`).join('');
  $('vcdn').textContent = `${s.vcd_changes} cambios en el VCD`;
  if (s.board.lcd_pixels !== lastPixels) { lastPixels = s.board.lcd_pixels; frame(); }
}

const lcd = $('lcd').getContext('2d'), img = lcd.createImageData(320, 240);
async function frame() {
  const buf = new Uint8Array(await (await fetch('/api/frame')).arrayBuffer());
  for (let i = 0, j = 0; i < buf.length; i += 2, j += 4) {
    const v = (buf[i] << 8) | buf[i + 1];
    img.data[j] = ((v >> 11) & 31) * 255 / 31; img.data[j + 1] = ((v >> 5) & 63) * 255 / 63;
    img.data[j + 2] = (v & 31) * 255 / 31; img.data[j + 3] = 255;
  }
  lcd.putImageData(img, 0, 0);
}

function chart(id, data, series, unit) {
  const c = $(id), dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const pts = series.map(s => data.map(d => [d.t, d[s.key]]).filter(p => p[1] !== null && p[1] !== undefined));
  const all = pts.flat();
  if (!all.length) return;
  const t0 = Math.min(...all.map(p => p[0])), t1 = Math.max(...all.map(p => p[0]), t0 + 1);
  let y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  if (y1 - y0 < 1e-6) { y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.1; y0 -= pad; y1 += pad;
  const X = t => 36 + (t - t0) / (t1 - t0) * (w - 44), Y = v => h - 18 - (v - y0) / (y1 - y0) * (h - 26);
  g.strokeStyle = css.getPropertyValue('--line'); g.fillStyle = css.getPropertyValue('--muted');
  g.font = '11px system-ui'; g.lineWidth = 1;
  for (const v of [y0 + pad, (y0 + y1) / 2, y1 - pad]) {
    g.beginPath(); g.moveTo(36, Y(v)); g.lineTo(w - 8, Y(v)); g.stroke();
    g.fillText(v.toFixed(Math.abs(v) < 10 ? 2 : 0), 2, Y(v) + 4);
  }
  g.fillText(`${t0.toFixed(1)} s`, 36, h - 4); g.fillText(`${t1.toFixed(1)} s`, w - 50, h - 4);
  series.forEach((s, k) => {
    g.strokeStyle = s.color; g.lineWidth = 2; g.beginPath();
    pts[k].forEach(([t, v], i) => i ? g.lineTo(X(t), Y(v)) : g.moveTo(X(t), Y(v))); g.stroke();
  });
  $(id.replace('ch-', 'lg-')).innerHTML = series.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('') + ` · ${unit}`;
}

async function poll() {
  try { render(await (await fetch('/api/state')).json()); } catch (e) { $('run').textContent = 'sin conexión'; }
}
async function plots() {
  try {
    const h = await (await fetch('/api/history')).json();
    chart('ch-boiler', h, [{key: 'boiler_c', label: 'temperatura', color: '#d9534f'}], '°C');
    chart('ch-rails', h, [{key: 'rail_12v', label: '12 V', color: '#2f6f9f'}, {key: 'rail_24v', label: '24 V', color: '#c7841a'}], 'V');
    chart('ch-brew', h, [{key: 'motor_a', label: 'motor (planta)', color: '#2e8b57'}], 'A');
  } catch (e) {}
}
poll(); plots();
setInterval(poll, 250); setInterval(plots, 1000);
</script>
</body>
</html>
